name: Linux live desktop
on:
  pull_request:
    paths: ["linux/**", "tests/linux/**", "brain_linux.py", ".github/workflows/linux-live.yml"]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Test images (GI stack, Xvfb + openbox, headless GNOME Shell)
        run: |
          docker build -q -f linux/packaging/test.Dockerfile -t atticus-linux-test .
          docker build -q -f linux/packaging/gnome-test.Dockerfile -t atticus-gnome-test .
      - name: Linux unit tests in the image
        run: docker run --rm -v "$PWD":/src atticus-linux-test sh linux/packaging/gui-tests.sh
      - name: Live X11 bridge
        run: docker run --rm -v "$PWD":/src atticus-linux-test sh linux/packaging/x11-live.sh
      - name: Live GNOME Shell extension
        run: docker run --rm -v "$PWD":/src atticus-gnome-test sh linux/packaging/gnome-live.sh
