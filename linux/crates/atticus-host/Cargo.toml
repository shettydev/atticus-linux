[package]
name = "atticus-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Atticus Linux native host daemon and 13+ CLI automation/capture helpers"

[features]
default = []
gui = ["dep:gtk4", "dep:webkit6", "dep:cairo-rs", "dep:glib"]
layer-shell = ["gui", "dep:gtk4-layer-shell"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
libc.workspace = true
whatlang.workspace = true
ureq.workspace = true

gtk4 = { version = "0.9", optional = true }
webkit6 = { version = "0.4", optional = true }
gtk4-layer-shell = { version = "0.4", optional = true }
cairo-rs = { version = "0.20", optional = true }
glib = { version = "0.20", optional = true }
