[workspace]
resolver = "2"
members = [
    "crates/atticus-host",
    "crates/atticus-inputd",
    "crates/atticus-browser-host",
]

[workspace.package]
version = "2.0.2"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
whatlang = "0.16"
ureq = { version = "2", features = ["json"] }

[profile.release]
debug = false
lto = "thin"
strip = "symbols"
